name: Generate Snake

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: litch-akr
          outputs: |
            dist/snake-dark.svg?color_snake=#ffffff&color_dots=#161616,#4d4d4d,#808080,#b3b3b3,#ffffff
            dist/snake-light.svg?color_snake=#000000&color_dots=#ebebeb,#b3b3b3,#808080,#4d4d4d,#000000

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
