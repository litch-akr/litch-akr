name: generate animated snake

on:
  schedule:
    - cron: "0 0 * * *"    # runs once a day
  workflow_dispatch: {}
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: generate snake svg
        uses: Platane/snk@v3
        with:
          github_user_name: litch-akr
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=#ffffff&color_dots=#1a0000,#4d0000,#800000,#b30000,#e50914
            dist/github-contribution-grid-snake-dark.svg?color_snake=#ffffff&color_dots=#1a0000,#4d0000,#800000,#b30000,#e50914

      - name: push snake svg to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
